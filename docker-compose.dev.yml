services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: legal_diff_user
      POSTGRES_PASSWORD: dev123
      POSTGRES_DB: legal_diff
    ports:
      - '5432:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U legal_diff_user']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data: